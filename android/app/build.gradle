apply plugin: 'com.android.application'

// Single source of truth for version: package.json. versionCode = versionMajor*1000 + versionMinor*100 + versionPatch.
def pkg = new groovy.json.JsonSlurper().parseText(file('../../package.json').text)
def (maj, min, pat) = pkg.version.tokenize('.').collect { it.toInteger() }
def vCode = maj * 1000 + min * 100 + pat

// Release keystore: android/keystore.properties (gitignored, never committed).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withReader { keystoreProps.load(it) }
}

android {
    namespace = "com.fredcouples.ember"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fredcouples.ember"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
        versionCode vCode
        versionName "${pkg.version}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Release signing from android/keystore.properties (gitignored). Falls back to
            // debug signing so assembleRelease still produces an installable APK on dev boxes.
            if (hasKeystore) {
                signingConfig signingConfigs.create('release') {
                    // Resolve the keystore relative to android/ (where keystore.properties lives),
                    // NOT relative to the app module — `file()` here means app/<name>, which is how
                    // the 2026-11-10 build failed with "Keystore file ... app\ember-release.keystore
                    // not found" even though the keystore sat in android/.
                    storeFile rootProject.file(keystoreProps['storeFile'])
                    storePassword keystoreProps['storePassword']
                    keyAlias keystoreProps['keyAlias']
                    keyPassword keystoreProps['keyPassword']
                }
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// DURABLE JAVA TARGET (2026-11-19, pi-main). `apply from: 'capacitor.build.gradle'` above
// is regenerated by `npx cap sync android` and has reset compileOptions to the Capacitor
// template's Java 21 while this box's JDK is 17 - which made assembleDebug fail with
// "invalid source release: 21" after a sync, even though commit 5540e8b had set both files
// to 17. Re-asserting here, AFTER the generated apply, means the app module's target is
// always ours regardless of what a future sync writes into the generated file.
android {
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
// (No options.release here: AGP rejects --release for Android compile tasks - it breaks
//  the bootclasspath. sourceCompatibility/targetCompatibility below are the AGP-sanctioned knobs.)
